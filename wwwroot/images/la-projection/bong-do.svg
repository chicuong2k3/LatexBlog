<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" font-family="'Segoe UI',Arial,sans-serif" font-size="15">
  <defs>
    <marker id="ah-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
  </defs>
  <!-- mặt đất / đường thẳng Delta -->
  <line x1="20" y1="250" x2="540" y2="250" stroke="#94a3b8" stroke-width="2"/>
  <text x="546" y="256" fill="#64748b" font-style="italic">Δ</text>
  <!-- mặt trời -->
  <circle cx="470" cy="55" r="24" fill="#fbbf24" stroke="#f59e0b" stroke-width="2"/>
  <g stroke="#f59e0b" stroke-width="2">
    <line x1="470" y1="14" x2="470" y2="4"/>
    <line x1="470" y1="96" x2="470" y2="106"/>
    <line x1="429" y1="55" x2="419" y2="55"/>
    <line x1="511" y1="55" x2="521" y2="55"/>
    <line x1="441" y1="26" x2="434" y2="19"/>
    <line x1="499" y1="26" x2="506" y2="19"/>
    <line x1="441" y1="84" x2="434" y2="91"/>
    <line x1="499" y1="84" x2="506" y2="91"/>
  </g>
  <!-- tia sáng chiếu xuống -->
  <line x1="440" y1="82" x2="356" y2="147" stroke="#b45309" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ah-amber)" opacity="0.85"/>
  <!-- con chim -->
  <circle cx="350" cy="150" r="5" fill="#0f172a"/>
  <text x="338" y="140" text-anchor="end" fill="#0f172a">chim M</text>
  <!-- đoạn vuông góc -->
  <line x1="350" y1="150" x2="350" y2="250" stroke="#a21caf" stroke-width="2" stroke-dasharray="6 5"/>
  <!-- hình chiếu trên mặt đất -->
  <line x1="318" y1="250" x2="382" y2="250" stroke="#a21caf" stroke-width="6" stroke-linecap="round"/>
  <text x="350" y="274" text-anchor="middle" fill="#a21caf" font-weight="600">hình chiếu H</text>
</svg>
