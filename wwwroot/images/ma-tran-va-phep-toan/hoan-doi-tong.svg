<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 480" role="img" aria-labelledby="t d" font-family="'Space Grotesk','Be Vietnam Pro','Segoe UI',Arial,sans-serif">
<title id="t">Cộng theo hàng rồi theo k cho P(Qu), cộng theo cột rồi theo j cho (PQ)u</title>
<desc id="d">Mỗi ô của bảng là một số hạng p_ik q_kj u_j. Cộng theo hàng được p_ik (Qu)_k rồi cộng theo k, ra tọa độ thứ i của P(Qu). Cộng theo cột được (PQ)_ij u_j rồi cộng theo j, ra tọa độ thứ i của (PQ)u. Hai cách cộng cho cùng một tổng.</desc>
<defs><marker id="arG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="arB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="arA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="arV" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7a5cff"/></marker><marker id="arM" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<text x="490.0" y="26.0" font-size="17" fill="#0f172a" text-anchor="middle" dominant-baseline="central" font-weight="600"><tspan >(</tspan><tspan font-style="italic">P</tspan><tspan >(</tspan><tspan font-style="italic">Q</tspan><tspan font-style="italic">u</tspan><tspan >)</tspan><tspan >)</tspan><tspan ></tspan><tspan font-size="12.6" dy="4.4">i</tspan><tspan dy="-4.4">  =  </tspan><tspan >∑</tspan><tspan font-size="12.6" dy="4.4">k</tspan><tspan dy="-4.4" font-style="italic">p</tspan><tspan font-size="12.6" dy="4.4">ik</tspan><tspan dy="-4.4">∑</tspan><tspan font-size="12.6" dy="4.4">j</tspan><tspan dy="-4.4" font-style="italic">q</tspan><tspan font-size="12.6" dy="4.4">kj</tspan><tspan dy="-4.4" font-style="italic">u</tspan><tspan font-size="12.6" dy="4.4">j</tspan><tspan dy="-4.4">  =  </tspan><tspan >∑</tspan><tspan font-size="12.6" dy="4.4">j</tspan><tspan dy="-4.4">(</tspan><tspan >∑</tspan><tspan font-size="12.6" dy="4.4">k</tspan><tspan dy="-4.4" font-style="italic">p</tspan><tspan font-size="12.6" dy="4.4">ik</tspan><tspan dy="-4.4" font-style="italic">q</tspan><tspan font-size="12.6" dy="4.4">kj</tspan><tspan dy="-4.4">)</tspan><tspan font-style="italic">u</tspan><tspan font-size="12.6" dy="4.4">j</tspan><tspan dy="-4.4">  =  </tspan><tspan >(</tspan><tspan >(</tspan><tspan font-style="italic">PQ</tspan><tspan >)</tspan><tspan font-style="italic">u</tspan><tspan >)</tspan><tspan ></tspan><tspan font-size="12.6" dy="4.4">i</tspan></text>
<text x="154.0" y="155.0" font-size="13" fill="#475569" text-anchor="end" dominant-baseline="central"><tspan font-style="italic">k</tspan><tspan > = 1</tspan></text>
<text x="154.0" y="247.0" font-size="13" fill="#475569" text-anchor="end" dominant-baseline="central"><tspan font-style="italic">k</tspan><tspan > = r</tspan></text>
<text x="154.0" y="201.0" font-size="15" fill="#475569" text-anchor="end" dominant-baseline="central"><tspan >⋮</tspan></text>
<text x="218.0" y="110.0" font-size="13" fill="#475569" text-anchor="middle" dominant-baseline="central"><tspan font-style="italic">j</tspan><tspan > = 1</tspan></text>
<text x="410.0" y="110.0" font-size="13" fill="#475569" text-anchor="middle" dominant-baseline="central"><tspan font-style="italic">j</tspan><tspan > = n</tspan></text>
<text x="314.0" y="110.0" font-size="15" fill="#475569" text-anchor="middle" dominant-baseline="central"><tspan >⋯</tspan></text>
<text x="314.0" y="84.0" font-size="13" fill="#475569" text-anchor="middle" dominant-baseline="central"><tspan >mỗi ô là một số hạng</tspan></text>
<rect x="170.0" y="132.0" width="288.0" height="138.0" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>
<line x1="170.0" y1="178.0" x2="458.0" y2="178.0" stroke="#e2e8f0" stroke-width="1.2"/>
<line x1="170.0" y1="224.0" x2="458.0" y2="224.0" stroke="#e2e8f0" stroke-width="1.2"/>
<line x1="266.0" y1="132.0" x2="266.0" y2="270.0" stroke="#e2e8f0" stroke-width="1.2"/>
<line x1="362.0" y1="132.0" x2="362.0" y2="270.0" stroke="#e2e8f0" stroke-width="1.2"/>
<rect x="268.0" y="180.0" width="92.0" height="42.0" rx="5" fill="#059669" fill-opacity="0.22"/>
<text x="314.0" y="201.0" font-size="15" fill="#0f172a" text-anchor="middle" dominant-baseline="central" font-weight="600"><tspan font-style="italic">p</tspan><tspan font-size="11.1" dy="3.9">ik</tspan><tspan dy="-3.9" font-style="italic">q</tspan><tspan font-size="11.1" dy="3.9">kj</tspan><tspan dy="-3.9" font-style="italic">u</tspan><tspan font-size="11.1" dy="3.9">j</tspan></text>
<circle cx="218.0" cy="155.0" r="3" fill="#cbd5e1"/>
<circle cx="314.0" cy="155.0" r="3" fill="#cbd5e1"/>
<circle cx="410.0" cy="155.0" r="3" fill="#cbd5e1"/>
<circle cx="218.0" cy="201.0" r="3" fill="#cbd5e1"/>
<circle cx="410.0" cy="201.0" r="3" fill="#cbd5e1"/>
<circle cx="218.0" cy="247.0" r="3" fill="#cbd5e1"/>
<circle cx="314.0" cy="247.0" r="3" fill="#cbd5e1"/>
<circle cx="410.0" cy="247.0" r="3" fill="#cbd5e1"/>
<path d="M480.0 136.0h-6v130.0h6" stroke="#7a5cff" stroke-width="2" fill="none"/>
<text x="498.0" y="142.0" font-size="13" fill="#7a5cff" text-anchor="start" dominant-baseline="central" font-weight="600"><tspan >cộng theo hàng, tức theo j</tspan></text>
<text x="498.0" y="172.0" font-size="14" fill="#0f172a" text-anchor="start" dominant-baseline="central"><tspan >∑</tspan><tspan font-size="10.4" dy="3.6">j</tspan><tspan dy="-3.6" font-style="italic">p</tspan><tspan font-size="10.4" dy="3.6">ik</tspan><tspan dy="-3.6" font-style="italic">q</tspan><tspan font-size="10.4" dy="3.6">kj</tspan><tspan dy="-3.6" font-style="italic">u</tspan><tspan font-size="10.4" dy="3.6">j</tspan><tspan dy="-3.6"> = </tspan><tspan font-style="italic">p</tspan><tspan font-size="10.4" dy="3.6">ik</tspan><tspan dy="-3.6">(</tspan><tspan font-style="italic">Q</tspan><tspan font-style="italic">u</tspan><tspan >)</tspan><tspan ></tspan><tspan font-size="10.4" dy="3.6">k</tspan></text>
<text x="498.0" y="206.0" font-size="13" fill="#475569" text-anchor="start" dominant-baseline="central"><tspan >rồi cộng theo k, được tọa độ thứ i của</tspan></text>
<text x="498.0" y="236.0" font-size="14" fill="#7a5cff" text-anchor="start" dominant-baseline="central" font-weight="700"><tspan >(</tspan><tspan font-style="italic">P</tspan><tspan >(</tspan><tspan font-style="italic">Q</tspan><tspan font-style="italic">u</tspan><tspan >)</tspan><tspan >)</tspan></text>
<path d="M174.0 298.0v6h280.0v-6" stroke="#059669" stroke-width="2" fill="none"/>
<text x="170.0" y="316.0" font-size="13" fill="#059669" text-anchor="start" dominant-baseline="central" font-weight="600"><tspan >cộng theo cột, tức theo k</tspan></text>
<text x="170.0" y="344.0" font-size="14" fill="#0f172a" text-anchor="start" dominant-baseline="central"><tspan >∑</tspan><tspan font-size="10.4" dy="3.6">k</tspan><tspan dy="-3.6" font-style="italic">p</tspan><tspan font-size="10.4" dy="3.6">ik</tspan><tspan dy="-3.6" font-style="italic">q</tspan><tspan font-size="10.4" dy="3.6">kj</tspan><tspan dy="-3.6" font-style="italic">u</tspan><tspan font-size="10.4" dy="3.6">j</tspan><tspan dy="-3.6"> = </tspan><tspan >(</tspan><tspan font-style="italic">PQ</tspan><tspan >)</tspan><tspan ></tspan><tspan font-size="10.4" dy="3.6">ij</tspan><tspan dy="-3.6" font-style="italic">u</tspan><tspan font-size="10.4" dy="3.6">j</tspan></text>
<text x="470.0" y="316.0" font-size="13" fill="#475569" text-anchor="start" dominant-baseline="central"><tspan >rồi cộng theo j, được tọa độ thứ i của</tspan></text>
<text x="470.0" y="344.0" font-size="14" fill="#059669" text-anchor="start" dominant-baseline="central" font-weight="700"><tspan >(</tspan><tspan >(</tspan><tspan font-style="italic">PQ</tspan><tspan >)</tspan><tspan font-style="italic">u</tspan><tspan >)</tspan></text>
<text x="490.0" y="392.0" font-size="14" fill="#475569" text-anchor="middle" dominant-baseline="central"><tspan >Hai cách cộng chỉ khác thứ tự nhóm các số hạng, nên cho cùng một tổng</tspan></text>
</svg>
