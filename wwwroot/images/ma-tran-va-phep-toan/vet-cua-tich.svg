<rect x="296.0" y="166.0" width="100.0" height="42.0" rx="5" fill="#7a5cff" fill-opacity="0.22"/>
<text x="346.0" y="187.0" font-size="15" fill="#0f172a" text-anchor="middle" dominant-baseline="central" font-weight="600"><tspan font-style="italic">a</tspan><tspan font-size="11.1" dy="3.9">ik</tspan><tspan dy="-3.9" font-style="italic">b</tspan><tspan font-size="11.1" dy="3.9">ki</tspan></text>
<circle cx="242.0" cy="141.0" r="3" fill="#cbd5e1"/>
<circle cx="346.0" cy="141.0" r="3" fill="#cbd5e1"/>
<circle cx="450.0" cy="141.0" r="3" fill="#cbd5e1"/>
