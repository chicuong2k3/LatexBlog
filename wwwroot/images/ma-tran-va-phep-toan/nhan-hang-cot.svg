<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" role="img" aria-labelledby="t1 d1"
     font-family="'Space Grotesk','Be Vietnam Pro','Segoe UI',Arial,sans-serif">
<title id="t1">Nhân hàng với cột trong phép nhân ma trận</title>
<desc id="d1">Hàng thứ hai của ma trận A ghép với cột thứ ba của ma trận B để cho phần tử ở hàng hai, cột ba của tích AB.</desc>

<defs>
  <marker id="mGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
  </marker>
</defs>

<!-- ============ A ============ -->
<text x="70" y="86" font-size="17" font-weight="600" fill="#475569">A</text>
<rect x="70" y="100" width="186" height="124" rx="4" fill="#f8fafc"/>
<path d="M132 100V224M194 100V224M70 162H256" stroke="#e2e8f0" stroke-width="1.5" fill="none"/>
<rect x="70" y="162" width="186" height="62" fill="#e63e8f" fill-opacity="0.13"/>
<rect x="70" y="162" width="186" height="62" fill="none" stroke="#e63e8f" stroke-opacity="0.45" stroke-width="1.5"/>
<path d="M68 100h-10M58 100V224M58 224h10" stroke="#94a3b8" stroke-width="2.5" fill="none"/>
<path d="M258 100h10M268 100V224M268 224h-10" stroke="#94a3b8" stroke-width="2.5" fill="none"/>
<g font-size="20" fill="#0f172a" text-anchor="middle" dominant-baseline="central">
  <text x="101" y="131">1</text><text x="163" y="131">2</text><text x="225" y="131">4</text>
  <text x="101" y="193">2</text><text x="163" y="193">6</text><text x="225" y="193">0</text>
</g>

<!-- ============ Â ============ -->
<text x="292" y="170" font-size="24" fill="#94a3b8" text-anchor="middle">×</text>

<!-- ============ B ============ -->
<text x="320" y="62" font-size="17" font-weight="600" fill="#475569">B</text>
<rect x="320" y="75" width="232" height="174" rx="4" fill="#f8fafc"/>
<path d="M378 75V249M436 75V249M494 75V249M320 133H552M320 191H552" stroke="#e2e8f0" stroke-width="1.5" fill="none"/>
<rect x="436" y="75" width="58" height="174" fill="#7a5cff" fill-opacity="0.13"/>
<rect x="436" y="75" width="58" height="174" fill="none" stroke="#7a5cff" stroke-opacity="0.45" stroke-width="1.5"/>
<path d="M318 75h-10M308 75V249M308 249h10" stroke="#94a3b8" stroke-width="2.5" fill="none"/>
<path d="M554 75h10M564 75V249M564 249h-10" stroke="#94a3b8" stroke-width="2.5" fill="none"/>
<g font-size="20" fill="#0f172a" text-anchor="middle" dominant-baseline="central">
  <text x="349" y="104">4</text><text x="407" y="104">1</text><text x="465" y="104">4</text><text x="523" y="104">3</text>
  <text x="349" y="162">0</text><text x="407" y="162">-1</text><text x="465" y="162">3</text><text x="523" y="162">1</text>
  <text x="349" y="220">2</text><text x="407" y="220">7</text><text x="465" y="220">5</text><text x="523" y="220">2</text>
</g>

<!-- ============ = ============ -->
<text x="570" y="170" font-size="24" fill="#94a3b8" text-anchor="middle">=</text>

<!-- ============ AB ============ -->
<text x="590" y="86" font-size="17" font-weight="600" fill="#475569">AB</text>
<rect x="590" y="100" width="208" height="124" rx="4" fill="#f8fafc"/>
<path d="M642 100V224M694 100V224M746 100V224M590 162H798" stroke="#e2e8f0" stroke-width="1.5" fill="none"/>
<rect x="694" y="162" width="52" height="62" fill="#059669" fill-opacity="0.14"/>
<rect x="694" y="162" width="52" height="62" fill="none" stroke="#059669" stroke-width="2"/>
<path d="M588 100h-10M578 100V224M578 224h10" stroke="#94a3b8" stroke-width="2.5" fill="none"/>
<path d="M800 100h10M810 100V224M810 224h-10" stroke="#94a3b8" stroke-width="2.5" fill="none"/>
<g font-size="20" fill="#0f172a" text-anchor="middle" dominant-baseline="central">
  <text x="616" y="131" fill="#94a3b8">?</text><text x="668" y="131" fill="#94a3b8">?</text>
  <text x="720" y="131" fill="#94a3b8">?</text><text x="772" y="131" fill="#94a3b8">?</text>
  <text x="616" y="193" fill="#94a3b8">?</text><text x="668" y="193" fill="#94a3b8">?</text>
  <text x="720" y="193" fill="#059669" font-weight="600">26</text>
  <text x="772" y="193" fill="#94a3b8">?</text>
</g>
<text x="822" y="196" font-size="14" fill="#059669" dominant-baseline="central">(AB)₂₃</text>

<!-- ============ chú thích ============ -->
<text x="163" y="284" font-size="15" fill="#e63e8f" text-anchor="middle">hàng 2 của A: (2, 6, 0)</text>
<text x="436" y="284" font-size="15" fill="#7a5cff" text-anchor="middle">cột 3 của B: (4, 3, 5)</text>

<text x="430" y="342" font-size="17" fill="#059669" text-anchor="middle" font-weight="600">26 = (2)(4) + (6)(3) + (0)(5)</text>
</svg>
