<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">Quỹ đạo quay quanh tâm lực và chuyển động apsis</title>
  <desc id="desc">Sơ đồ tổng hợp dựng lại cho Phần IX: quỹ đạo cố định VPK, quỹ đạo quay quanh C, các vị trí tương ứng P, p, K, k và các góc quét.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 z" fill="#b45309"/>
    </marker>
  </defs>
  <rect width="960" height="560" fill="#fffdf8"/>
  <g fill="none" stroke="#526078" stroke-width="3">
    <ellipse cx="460" cy="285" rx="300" ry="125"/>
    <path d="M 140 390 Q 430 90 760 390" stroke="#b45309" stroke-width="4"/>
    <line x1="460" y1="285" x2="160" y2="390"/>
    <line x1="460" y1="285" x2="760" y2="390"/>
    <line x1="460" y1="285" x2="690" y2="160"/>
    <line x1="460" y1="285" x2="610" y2="105"/>
  </g>
  <g fill="#b45309">
    <circle cx="460" cy="285" r="8"/>
    <circle cx="690" cy="160" r="7"/>
    <circle cx="610" cy="105" r="7"/>
    <circle cx="160" cy="390" r="7"/>
    <circle cx="760" cy="390" r="7"/>
  </g>
  <g fill="#263248" font-family="Georgia, serif" font-size="22">
    <text x="470" y="275">C</text><text x="700" y="150">P</text><text x="620" y="95">p</text><text x="135" y="415">V</text><text x="770" y="415">K</text>
  </g>
  <g fill="#526078" font-family="Georgia, serif" font-size="18">
    <text x="110" y="485">quỹ đạo cố định</text><text x="520" y="445">quỹ đạo quay</text><text x="560" y="230">góc quét</text>
  </g>
</svg>
