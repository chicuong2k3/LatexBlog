<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Quỹ đạo elip và các đường kính liên hợp</title>
  <desc id="desc">Minh họa Proposition X: elip có các bán trục CA, CB, các đường kính liên hợp GP, DK, các đường vuông góc PF, QT và hình bình hành QvPR.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b45309"/>
    </marker>
  </defs>
  <rect width="900" height="520" fill="#fffdf8"/>
  <ellipse cx="450" cy="260" rx="300" ry="150" fill="none" stroke="#263248" stroke-width="5"/>
  <g fill="none" stroke="#526078" stroke-width="3">
    <path d="M 150 260 L 750 260"/>
    <path d="M 450 110 L 450 410"/>
    <path d="M 260 335 L 640 185"/>
    <path d="M 640 185 L 260 335"/>
  </g>
  <path d="M 450 260 L 610 213" stroke="#b45309" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M 610 213 L 650 120" stroke="#b45309" stroke-width="3"/>
  <path d="M 610 213 L 740 250" stroke="#b45309" stroke-width="3"/>
  <g fill="#263248" font-family="Georgia, serif" font-size="22">
    <text x="430" y="290">C</text><text x="140" y="245">A</text><text x="745" y="245">B</text>
    <text x="250" y="365">G</text><text x="630" y="170">D</text><text x="600" y="200">P</text>
    <text x="735" y="240">Q</text><text x="640" y="110">F</text>
  </g>
  <g fill="#526078" font-family="Georgia, serif" font-size="19">
    <text x="100" y="465">CA, CB: bán trục</text>
    <text x="350" y="465">GP, DK: đường kính liên hợp</text>
    <text x="675" y="390">PF, QT: vuông góc</text>
  </g>
</svg>
