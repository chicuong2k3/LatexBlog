services:
  web:
    build: .
    image: alternative-world:latest
    container_name: alternative-world
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8090}:8090"
    environment:
      - ASPNETCORE_URLS=http://+:8090
    networks:
      # cloudflared lives on this network and reaches the app as
      # http://alternative-world:8090 (container port matches tunnel route).
      - cfnet
    # Supabase config ships in appsettings.json (publishable anon key). To point
    # at another project without rebuilding, uncomment and set these — an empty
    # value would override the file with an empty string, so leave them out
    # entirely rather than setting them blank.
    # environment:
    #   - Supabase__Url=https://xxxx.supabase.co
    #   - Supabase__AnonKey=sb_publishable_xxx

networks:
  cfnet:
    external: true
