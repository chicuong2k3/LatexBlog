<circle cx="450.0" cy="233.0" r="3" fill="#cbd5e1"/>
<path d="M524.0 122.0h-6v130.0h6" stroke="#7a5cff" stroke-width="2" fill="none"/>
<text x="542.0" y="128.0" font-size="13" fill="#7a5cff" text-anchor="start" dominant-baseline="central" font-weight="600"><tspan >cộng theo hàng, tức theo k</tspan></text>
<text x="542.0" y="160.0" font-size="14" fill="#0f172a" text-anchor="start" dominant-baseline="central"><tspan >∑</tspan><tspan font-size="10.4" dy="3.6">k</tspan><tspan dy="-3.6" font-style="italic">a</tspan><tspan font-size="10.4" dy="3.6">ik</tspan><tspan dy="-3.6" font-style="italic">b</tspan><tspan font-size="10.4" dy="3.6">ki</tspan><tspan dy="-3.6"> = </tspan><tspan >(</tspan><tspan font-style="italic">AB</tspan><tspan >)</tspan><tspan font-size="10.4" dy="3.6">ii</tspan></text>
<text x="542.0" y="192.0" font-size="13" fill="#475569" text-anchor="start" dominant-baseline="central"><tspan >rồi cộng theo i, được tr(AB)</tspan></text>
<path d="M194.0 284.0v6h304.0v-6" stroke="#059669" stroke-width="2" fill="none"/>
<text x="190.0" y="302.0" font-size="13" fill="#059669" text-anchor="start" dominant-baseline="central" font-weight="600"><tspan >cộng theo cột, tức theo i</tspan></text>
<text x="190.0" y="332.0" font-size="14" fill="#0f172a" text-anchor="start" dominant-baseline="central"><tspan >∑</tspan><tspan font-size="10.4" dy="3.6">i</tspan><tspan dy="-3.6" font-style="italic">a</tspan><tspan font-size="10.4" dy="3.6">ik</tspan><tspan dy="-3.6" font-style="italic">b</tspan><tspan font-size="10.4" dy="3.6">ki</tspan><tspan dy="-3.6"> = </tspan><tspan >(</tspan><tspan font-style="italic">BA</tspan><tspan >)</tspan><tspan font-size="10.4" dy="3.6">kk</tspan></text>
<text x="490.0" y="302.0" font-size="13" fill="#475569" text-anchor="start" dominant-baseline="central"><tspan >rồi cộng theo k, được tr(BA)</tspan></text>
<text x="490.0" y="376.0" font-size="14" fill="#475569" text-anchor="middle" dominant-baseline="central"><tspan >Hai tổng chỉ khác thứ tự viết các số hạng, nên bằng nhau</tspan></text>
</svg>
