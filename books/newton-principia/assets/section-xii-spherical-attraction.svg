<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Lực hút của các vật thể cầu</title>
  <desc id="desc">Sơ đồ tổng hợp cho Phần XII: hạt thể bên ngoài và bên trong quả cầu, các lớp cầu đồng tâm và đường hướng lực về tâm.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 z" fill="#b45309"/>
    </marker>
  </defs>
  <rect width="900" height="520" fill="#fffdf8"/>
  <circle cx="450" cy="270" r="180" fill="#eef4f2" stroke="#526078" stroke-width="4"/>
  <circle cx="450" cy="270" r="120" fill="none" stroke="#526078" stroke-width="2" stroke-dasharray="8 7"/>
  <circle cx="450" cy="270" r="8" fill="#b45309"/>
  <circle cx="450" cy="90" r="8" fill="#b45309"/>
  <circle cx="450" cy="450" r="8" fill="#b45309"/>
  <line x1="450" y1="90" x2="450" y2="262" stroke="#b45309" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="450" y1="450" x2="450" y2="278" stroke="#b45309" stroke-width="4" marker-end="url(#arrow)"/>
  <g fill="#263248" font-family="Georgia, serif" font-size="22">
    <text x="460" y="265">S</text><text x="460" y="80">P</text><text x="460" y="465">p</text>
  </g>
  <g fill="#526078" font-family="Georgia, serif" font-size="18">
    <text x="100" y="490">lớp cầu đồng tâm</text><text x="615" y="185">lực hướng tâm</text><text x="615" y="390">điểm bên trong</text>
  </g>
</svg>
