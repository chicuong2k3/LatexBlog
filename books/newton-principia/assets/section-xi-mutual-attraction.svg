<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Chuyển động của các vật thể hút nhau</title>
  <desc id="desc">Sơ đồ tổng hợp cho Phần XI: các vật thể S, P quanh tâm trọng lực C, các quỹ đạo tương tự và các lực hút giữa chúng.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 z" fill="#b45309"/>
    </marker>
  </defs>
  <rect width="900" height="520" fill="#fffdf8"/>
  <g fill="none" stroke="#526078" stroke-width="3">
    <ellipse cx="450" cy="275" rx="280" ry="120"/>
    <line x1="450" y1="275" x2="250" y2="170"/>
    <line x1="450" y1="275" x2="650" y2="380"/>
    <line x1="250" y1="170" x2="650" y2="380" stroke="#b45309" stroke-width="4"/>
  </g>
  <g fill="#b45309">
    <circle cx="450" cy="275" r="8"/>
    <circle cx="250" cy="170" r="7"/>
    <circle cx="650" cy="380" r="7"/>
  </g>
  <g fill="#263248" font-family="Georgia, serif" font-size="22">
    <text x="460" y="265">C</text><text x="225" y="155">S</text><text x="660" y="400">P</text>
  </g>
  <g fill="#526078" font-family="Georgia, serif" font-size="18">
    <text x="90" y="450">tâm trọng lực chung</text><text x="520" y="115">lực hút giữa hai vật thể</text><text x="115" y="250">quỹ đạo tương tự</text>
  </g>
</svg>
