<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" role="img" aria-labelledby="title desc">
  <title id="title">Các cách dựng quỹ đạo từ điểm và tiếp tuyến</title>
  <desc id="desc">Sơ đồ tổng hợp dựng lại cho Proposition XXIII–XXIV: các điểm A, B, C, P, D, tiếp tuyến và các đường phụ.</desc>
  <rect width="980" height="560" fill="#fffdf8"/>
  <ellipse cx="470" cy="285" rx="300" ry="135" fill="none" stroke="#263248" stroke-width="5"/>
  <g stroke="#526078" stroke-width="3" fill="none">
    <line x1="90" y1="160" x2="790" y2="160"/>
    <line x1="90" y1="160" x2="470" y2="285"/>
    <line x1="790" y1="160" x2="470" y2="285"/>
    <line x1="470" y1="285" x2="700" y2="430"/>
    <line x1="470" y1="285" x2="250" y2="430"/>
    <line x1="250" y1="430" x2="700" y2="430"/>
    <line x1="700" y1="430" x2="790" y2="160"/>
  </g>
  <g fill="#b45309">
    <circle cx="470" cy="285" r="8"/>
    <circle cx="90" cy="160" r="7"/>
    <circle cx="790" cy="160" r="7"/>
    <circle cx="250" cy="430" r="7"/>
    <circle cx="700" cy="430" r="7"/>
  </g>
  <g fill="#263248" font-family="Georgia, serif" font-size="22">
    <text x="480" y="275">P</text><text x="65" y="150">A</text><text x="800" y="150">B</text><text x="225" y="460">C</text><text x="705" y="460">D</text>
  </g>
  <g fill="#526078" font-family="Georgia, serif" font-size="18">
    <text x="70" y="510">các điểm đã cho</text><text x="535" y="205">tiếp tuyến</text><text x="505" y="390">đường phụ</text>
  </g>
</svg>
