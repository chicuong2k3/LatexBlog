<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="title desc">
  <title id="title">Parabol, tiêu điểm, tiếp tuyến và lực hướng tâm</title>
  <desc id="desc">Sơ đồ Lemma XIII–XIV và Proposition XIII: parabol có đỉnh A, tiêu điểm S, tiếp tuyến PM, điểm tiếp xúc P và các đoạn hỗ trợ.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b45309"/>
    </marker>
  </defs>
  <rect width="900" height="500" fill="#fffdf8"/>
  <path d="M 100 400 Q 450 -20 800 400" fill="none" stroke="#263248" stroke-width="5"/>
  <path d="M 100 400 L 800 400" stroke="#526078" stroke-width="3"/>
  <path d="M 450 400 L 450 300" stroke="#526078" stroke-width="3" stroke-dasharray="7 7"/>
  <path d="M 450 400 L 640 155" stroke="#b45309" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M 640 155 L 720 80" stroke="#526078" stroke-width="3"/>
  <path d="M 450 300 L 640 155" stroke="#526078" stroke-width="3"/>
  <circle cx="450" cy="300" r="7" fill="#b45309"/>
  <g fill="#263248" font-family="Georgia, serif" font-size="22">
    <text x="430" y="440">A</text><text x="430" y="290">S</text><text x="630" y="145">P</text><text x="710" y="70">M</text>
  </g>
  <g fill="#526078" font-family="Georgia, serif" font-size="19">
    <text x="120" y="475">parabol</text><text x="365" y="475">tiêu điểm S</text><text x="625" y="475">tiếp tuyến PM</text>
  </g>
</svg>
