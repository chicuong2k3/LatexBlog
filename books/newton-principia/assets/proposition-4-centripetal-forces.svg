<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Hai quỹ đạo tròn và lực hướng tâm</title>
  <desc id="desc">Hai đường tròn có tâm S1 và S2, cùng các bán kính, cung và mũi tên lực hướng tâm hướng về tâm.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b45309"/>
    </marker>
  </defs>
  <rect width="900" height="520" fill="#fffdf8"/>
  <g fill="none" stroke="#263248" stroke-width="4">
    <circle cx="280" cy="270" r="150"/>
    <circle cx="650" cy="270" r="95"/>
  </g>
  <g fill="#b45309">
    <circle cx="280" cy="270" r="7"/><circle cx="650" cy="270" r="7"/>
  </g>
  <g fill="none" stroke="#b45309" stroke-width="4" marker-end="url(#arrow)">
    <path d="M 280 120 L 280 270"/>
    <path d="M 650 175 L 650 270"/>
  </g>
  <g fill="none" stroke="#526078" stroke-width="2" stroke-dasharray="7 7">
    <path d="M 280 120 L 400 180"/>
    <path d="M 650 175 L 730 220"/>
  </g>
  <g fill="#263248" font-family="Georgia, serif" font-size="23">
    <text x="260" y="300">S₁</text><text x="630" y="300">S₂</text>
    <text x="290" y="105">A</text><text x="405" y="175">B</text>
    <text x="660" y="160">C</text><text x="735" y="215">D</text>
    <text x="110" y="470">vận tốc và bán kính</text>
    <text x="540" y="470">lực hướng tâm</text>
  </g>
  <g fill="#526078" font-family="Georgia, serif" font-size="19">
    <text x="120" y="510">cung mô tả trong cùng thời gian</text>
    <text x="570" y="510">tỷ lệ lực theo bình phương cung</text>
  </g>
</svg>
