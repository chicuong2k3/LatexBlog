<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Sơ đồ Proposition VII đến Proposition IX</title>
  <desc id="desc">Ba sơ đồ: quỹ đạo tròn với tâm lực S, nửa đường tròn với các đường song song, và đường xoáy ốc cắt các bán kính.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b45309"/>
    </marker>
  </defs>
  <rect width="1200" height="620" fill="#fffdf8"/>
  <g stroke="#d6dbe5" stroke-width="2"><path d="M400 40V580"/><path d="M800 40V580"/></g>
  <g fill="#263248" font-family="Georgia, serif" font-size="22">
    <text x="35" y="35">VII. Quỹ đạo tròn</text>
    <text x="435" y="35">VIII. Nửa đường tròn</text>
    <text x="835" y="35">IX. Đường xoáy ốc</text>
  </g>
  <g transform="translate(40 100)">
    <circle cx="170" cy="180" r="130" fill="none" stroke="#263248" stroke-width="4"/>
    <circle cx="170" cy="180" r="7" fill="#b45309"/>
    <path d="M 170 180 L 260 75" stroke="#b45309" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M 170 180 L 100 40" stroke="#526078" stroke-width="3" stroke-dasharray="7 7"/>
    <path d="M 100 40 L 260 75" stroke="#526078" stroke-width="3"/>
    <g fill="#263248" font-family="Georgia, serif" font-size="18"><text x="155" y="205">S</text><text x="260" y="65">P</text><text x="75" y="35">V</text><text x="45" y="100">Q</text></g>
  </g>
  <g transform="translate(430 100)">
    <path d="M 30 300 A 150 150 0 0 1 330 300" fill="none" stroke="#263248" stroke-width="4"/>
    <path d="M 30 300 L 330 300" stroke="#526078" stroke-width="3"/>
    <path d="M 80 240 L 280 240" stroke="#b45309" stroke-width="3"/>
    <path d="M 80 240 L 80 300" stroke="#b45309" stroke-width="3"/>
    <path d="M 280 240 L 280 300" stroke="#b45309" stroke-width="3"/>
    <g fill="#263248" font-family="Georgia, serif" font-size="18"><text x="10" y="330">C</text><text x="310" y="330">A</text><text x="60" y="230">P</text><text x="260" y="230">Q</text></g>
  </g>
  <g transform="translate(840 100)">
    <path d="M 170 300 C 30 260 30 160 120 110 C 220 55 320 80 300 180 C 280 275 100 300 60 230" fill="none" stroke="#b45309" stroke-width="5"/>
    <path d="M 170 300 L 300 180" stroke="#526078" stroke-width="3"/>
    <path d="M 170 300 L 120 110" stroke="#526078" stroke-width="3"/>
    <circle cx="170" cy="300" r="7" fill="#b45309"/>
    <g fill="#263248" font-family="Georgia, serif" font-size="18"><text x="155" y="330">S</text><text x="95" y="100">P</text><text x="300" y="170">Q</text></g>
  </g>
  <g fill="#526078" font-family="Georgia, serif" font-size="19">
    <text x="65" y="500">tâm lực ở một điểm bất kỳ</text>
    <text x="450" y="500"> các khoảng cách tới tâm ở xa</text>
    <text x="855" y="500">cắt các bán kính theo góc</text>
  </g>
</svg>
