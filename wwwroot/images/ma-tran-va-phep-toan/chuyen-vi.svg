<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" role="img" aria-labelledby="title desc">
<title id="title">Chuyển vị đổi hàng thành cột</title>
<desc id="desc">Ma trận A được soi qua đường chéo chính để thành A chuyển vị.</desc>
<style>
.bg{fill:#0f172a}.grid{fill:#111827;stroke:#475569;stroke-width:2}.diag{stroke:#22c55e;stroke-width:4}.hi{fill:#2563eb;opacity:.65}.hi2{fill:#f97316;opacity:.65}.txt{font:24px system-ui,Segoe UI,sans-serif;fill:#e5e7eb}.num{font:24px ui-monospace,Menlo,monospace;fill:#f8fafc;text-anchor:middle;dominant-baseline:middle}.small{font:18px system-ui,Segoe UI,sans-serif;fill:#cbd5e1}
</style>
<rect class="bg" width="860" height="330" rx="18"/>
<text class="txt" x="140" y="55">A</text><text class="txt" x="610" y="55">Aᵀ</text>
<g transform="translate(80 90)">
  <rect class="grid" x="0" y="0" width="180" height="180" rx="8"/>
  <path d="M60 0v180M120 0v180M0 60h180M0 120h180" stroke="#475569" stroke-width="2"/>
  <rect class="hi" x="0" y="60" width="180" height="60"/>
  <line class="diag" x1="0" y1="0" x2="180" y2="180"/>
  <text class="num" x="30" y="30">2</text><text class="num" x="90" y="30">-3</text><text class="num" x="150" y="30">1</text>
  <text class="num" x="30" y="90">7</text><text class="num" x="90" y="90">0</text><text class="num" x="150" y="90">4</text>
  <text class="num" x="30" y="150">5</text><text class="num" x="90" y="150">6</text><text class="num" x="150" y="150">-1</text>
</g>
<path d="M335 180 C395 105 455 105 515 180" stroke="#cbd5e1" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#cbd5e1"/></marker></defs>
<g transform="translate(580 90)">
  <rect class="grid" x="0" y="0" width="180" height="180" rx="8"/>
  <path d="M60 0v180M120 0v180M0 60h180M0 120h180" stroke="#475569" stroke-width="2"/>
  <rect class="hi2" x="60" y="0" width="60" height="180"/>
  <line class="diag" x1="0" y1="0" x2="180" y2="180"/>
  <text class="num" x="30" y="30">2</text><text class="num" x="90" y="30">7</text><text class="num" x="150" y="30">5</text>
  <text class="num" x="30" y="90">-3</text><text class="num" x="90" y="90">0</text><text class="num" x="150" y="90">6</text>
  <text class="num" x="30" y="150">1</text><text class="num" x="90" y="150">4</text><text class="num" x="150" y="150">-1</text>
</g>
<text class="small" x="300" y="285">hàng 2 của A thành cột 2 của Aᵀ</text>
</svg>
