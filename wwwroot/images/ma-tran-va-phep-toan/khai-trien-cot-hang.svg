<title id="t">AB là tổng các tích của cột thứ k trong A với hàng thứ k trong B</title>
<desc id="d">Cột k của A là một vector cột, hàng k của B là một vector hàng. Tích của chúng là một ma trận mà ô hàng i cột j bằng a_ik b_kj. Cộng theo k từ 1 đến r, ta được AB.</desc>
