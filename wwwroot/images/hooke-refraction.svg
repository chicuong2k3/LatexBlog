<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="Georgia, serif" font-size="14">
  <rect width="600" height="420" fill="#fafafa" rx="8"/>
  <rect x="0" y="0" width="600" height="200" fill="#e8f4f8" rx="8"/>
  <text x="30" y="30" font-size="13" fill="#5a7a8a" font-style="italic">Môi trường 1 (không khí)</text>
  <text x="30" y="48" font-size="12" fill="#5a7a8a">vận tốc v₁</text>
  <rect x="0" y="200" width="600" height="220" fill="#d4e8d0" rx="0"/>
  <text x="30" y="230" font-size="13" fill="#3a6a3a" font-style="italic">Môi trường 2 (kính)</text>
  <text x="30" y="248" font-size="12" fill="#3a6a3a">vận tốc v₂ &lt; v₁</text>
  <line x1="0" y1="200" x2="600" y2="200" stroke="#333" stroke-width="2.5"/>
  <text x="540" y="195" font-size="12" fill="#333" font-weight="bold">Bề mặt</text>
  <line x1="300" y1="100" x2="300" y2="320" stroke="#999" stroke-width="1" stroke-dasharray="6,4"/>
  <text x="308" y="115" font-size="11" fill="#999">Pháp tuyến</text>
  <line x1="140" y1="100" x2="360" y2="180" stroke="#2196F3" stroke-width="3" stroke-linecap="round"/>
  <text x="130" y="88" font-size="13" fill="#2196F3" font-weight="bold">Wave-front</text>
  <text x="130" y="105" font-size="11" fill="#2196F3">(trước khúc xạ)</text>
  <circle cx="140" cy="100" r="5" fill="#2196F3"/>
  <text x="120" y="92" font-size="12" fill="#2196F3" font-weight="bold">A</text>
  <circle cx="360" cy="180" r="5" fill="#e53935"/>
  <text x="368" y="175" font-size="12" fill="#e53935" font-weight="bold">B</text>
  <line x1="360" y1="185" x2="360" y2="198" stroke="#e53935" stroke-width="2"/>
  <text x="370" y="198" font-size="10" fill="#e53935">chạm trước!</text>
  <line x1="140" y1="100" x2="340" y2="260" stroke="#FF9800" stroke-width="3" stroke-linecap="round"/>
  <text x="350" y="270" font-size="13" fill="#FF9800" font-weight="bold">Wave-front mới</text>
  <text x="350" y="288" font-size="11" fill="#FF9800">(sau khúc xạ)</text>
  <circle cx="340" cy="260" r="5" fill="#FF9800"/>
  <text x="348" y="255" font-size="12" fill="#FF9800" font-weight="bold">C</text>
  <path d="M 355 230 A 30 30 0 0 1 360 200" fill="none" stroke="#9C27B0" stroke-width="1.5"/>
  <text x="370" y="222" font-size="11" fill="#9C27B0" font-weight="bold">góc khúc xạ</text>
  <line x1="240" y1="40" x2="320" y2="200" stroke="#333" stroke-width="2" stroke-dasharray="8,4"/>
  <polygon points="320,200 312,186 326,186" fill="#333"/>
  <text x="230" y="38" font-size="12" fill="#333">Tia sáng</text>
  <line x1="320" y1="200" x2="280" y2="370" stroke="#333" stroke-width="2"/>
  <polygon points="280,370 274,354 288,354" fill="#333"/>
  <rect x="420" y="310" width="170" height="95" fill="white" stroke="#ccc" rx="6"/>
  <line x1="430" y1="330" x2="460" y2="330" stroke="#2196F3" stroke-width="3"/>
  <text x="465" y="334" font-size="11" fill="#333">Trước khúc xạ</text>
  <line x1="430" y1="355" x2="460" y2="355" stroke="#FF9800" stroke-width="3"/>
  <text x="465" y="359" font-size="11" fill="#333">Sau khúc xạ</text>
  <line x1="430" y1="380" x2="460" y2="380" stroke="#333" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="465" y="384" font-size="11" fill="#333">Tia sáng (ray)</text>
  <rect x="20" y="310" width="260" height="55" fill="white" stroke="#ddd" rx="6" opacity="0.95"/>
  <text x="30" y="330" font-size="12" fill="#333"><tspan font-weight="bold">Điểm B</tspan> chạm bề mặt trước →</text>
  <text x="30" y="348" font-size="12" fill="#333">chuyển sang môi trường mới, <tspan fill="#e53935">chậm lại</tspan></text>
  <text x="30" y="358" font-size="10" fill="#666">Điểm A vẫn ở môi trường cũ → giữ vận tốc v₁</text>
</svg>
