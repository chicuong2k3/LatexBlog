<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
  <title id="title">Phân tích lực trên bánh xe và mặt phẳng nghiêng</title>
  <desc id="desc">Sơ đồ tái tạo các đường lực, bánh xe, đòn cân và mặt phẳng nghiêng trong Hệ quả II của Định luật vận động.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/>
    </marker>
    <marker id="smallArrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#526078"/>
    </marker>
  </defs>
  <rect width="1000" height="560" fill="#fffdf8"/>
  <g stroke="#d6dbe5" stroke-width="2">
    <path d="M 500 35 V 525"/>
  </g>
  <g fill="#263248" font-family="Georgia, serif" font-size="25">
    <text x="35" y="45">Bánh xe và đòn cân</text>
    <text x="535" y="45">Mặt phẳng nghiêng</text>
  </g>
  <g transform="translate(250 275)">
    <circle r="128" fill="none" stroke="#263248" stroke-width="5"/>
    <circle r="12" fill="#263248"/>
    <path d="M -128 0 L 128 0" stroke="#526078" stroke-width="3" marker-end="url(#smallArrow)"/>
    <path d="M 0 0 L -76 -102" stroke="#b45309" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M 0 0 L 92 76" stroke="#b45309" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M -76 -102 L -160 -180" stroke="#526078" stroke-width="3"/>
    <path d="M 92 76 L 175 155" stroke="#526078" stroke-width="3"/>
    <rect x="-184" y="-214" width="48" height="34" fill="#e9edf3" stroke="#263248" stroke-width="2"/>
    <rect x="160" y="140" width="48" height="34" fill="#e9edf3" stroke="#263248" stroke-width="2"/>
    <g fill="#263248" font-family="Georgia, serif" font-size="22">
      <text x="-15" y="-145">O</text>
      <text x="-105" y="-110">M</text>
      <text x="98" y="68">N</text>
      <text x="-180" y="-225">A</text>
      <text x="176" y="135">P</text>
      <text x="-245" y="-10">K</text>
      <text x="135" y="-10">L</text>
    </g>
  </g>
  <g transform="translate(520 120)">
    <path d="M 30 350 L 390 120" stroke="#263248" stroke-width="6"/>
    <path d="M 80 410 L 410 410" stroke="#526078" stroke-width="3"/>
    <path d="M 180 315 L 180 190" stroke="#526078" stroke-width="3" marker-end="url(#smallArrow)"/>
    <circle cx="180" cy="180" r="27" fill="#e9edf3" stroke="#263248" stroke-width="4"/>
    <path d="M 180 180 L 330 80" stroke="#b45309" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M 180 180 L 70 245" stroke="#b45309" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M 70 245 L 70 410" stroke="#526078" stroke-width="3" marker-end="url(#smallArrow)"/>
    <g fill="#263248" font-family="Georgia, serif" font-size="22">
      <text x="170" y="205">p</text>
      <text x="335" y="78">pG</text>
      <text x="30" y="365">pQ</text>
      <text x="90" y="270">pN</text>
      <text x="190" y="270">HN</text>
    </g>
  </g>
  <g fill="#526078" font-family="Georgia, serif" font-size="20">
    <text x="75" y="520">Lực được phân tích thành hai thành phần vuông góc.</text>
    <text x="535" y="520">Sơ đồ được dựng lại từ sơ đồ ASCII trong bản gốc.</text>
  </g>
</svg>
