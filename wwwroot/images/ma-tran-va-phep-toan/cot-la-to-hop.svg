<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-labelledby="t3 d3"
     font-family="'Space Grotesk','Be Vietnam Pro','Segoe UI',Arial,sans-serif">
<title id="t3">Cột của tích là tổ hợp tuyến tính của các cột của A</title>
<desc id="d3">Với a1 bằng (1,0), a2 bằng (0,1), a3 bằng (1,1) và b bằng (2, -1, 3) thì Ab bằng 2a1 trừ a2 cộng 3a3 bằng (5,2). Ba mũi tên nét đứt nối đầu đuôi đi tới đúng điểm (5,2).</desc>

<defs>
  <marker id="mAxis" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
  </marker>
  <marker id="mBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
  </marker>
  <marker id="mAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
  </marker>
  <marker id="mViolet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="#7a5cff"/>
  </marker>
  <marker id="mGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
  </marker>
</defs>

<!-- ============ mặt phẳng tọa độ ============ -->
<g stroke="#e2e8f0" stroke-width="1">
  <line x1="148" y1="148" x2="148" y2="340"/>
  <line x1="196" y1="148" x2="196" y2="340"/>
  <line x1="244" y1="148" x2="244" y2="340"/>
  <line x1="292" y1="148" x2="292" y2="340"/>
  <line x1="340" y1="148" x2="340" y2="340"/>
  <line x1="388" y1="148" x2="388" y2="340"/>
  <line x1="100" y1="292" x2="388" y2="292"/>
  <line x1="100" y1="244" x2="388" y2="244"/>
  <line x1="100" y1="196" x2="388" y2="196"/>
</g>
<line x1="66" y1="340" x2="402" y2="340" stroke="#64748b" stroke-width="1.5" marker-end="url(#mAxis)"/>
<line x1="100" y1="352" x2="100" y2="146" stroke="#64748b" stroke-width="1.5" marker-end="url(#mAxis)"/>
<text x="408" y="345" font-size="15" fill="#64748b" font-style="italic">x</text>
<text x="86" y="150" font-size="15" fill="#64748b" font-style="italic" text-anchor="end">y</text>
<text x="86" y="356" font-size="14" fill="#64748b" text-anchor="end">O</text>
<g font-size="12" fill="#94a3b8" text-anchor="middle">
  <text x="148" y="336">1</text><text x="196" y="336">2</text><text x="244" y="336">3</text>
  <text x="292" y="336">4</text><text x="340" y="336">5</text>
</g>
<g font-size="12" fill="#94a3b8" text-anchor="end">
  <text x="92" y="296">1</text><text x="92" y="248">2</text><text x="92" y="200">3</text>
</g>

<!-- ============ ba bước nối đầu đuôi ============ -->
<path d="M100 340H196" stroke="#2563eb" stroke-width="3" stroke-dasharray="7 5" fill="none"/>
<path d="M196 340V388" stroke="#d97706" stroke-width="3" stroke-dasharray="7 5" fill="none"/>
<path d="M196 388L318 266" stroke="#7a5cff" stroke-width="3" stroke-dasharray="7 5" fill="none"/>
<path d="M100 340L340 244" stroke="#059669" stroke-width="3.5" fill="none" marker-end="url(#mGreen)"/>

<circle cx="100" cy="340" r="4.5" fill="#0f172a"/>
<circle cx="196" cy="340" r="4" fill="#2563eb"/>
<circle cx="196" cy="388" r="4" fill="#d97706"/>
<circle cx="340" cy="244" r="5" fill="#059669"/>

<text x="148" y="366" font-size="15" fill="#2563eb" text-anchor="middle">2a₁</text>
<text x="186" y="380" font-size="15" fill="#d97706" text-anchor="end">−a₂</text>
<text x="252" y="354" font-size="15" fill="#7a5cff">3a₃</text>
<text x="350" y="236" font-size="16" fill="#059669" font-weight="600">Ab = (5, 2)</text>

<!-- ============ bảng A và b ============ -->
<text x="560" y="98" font-size="15" fill="#475569" text-anchor="middle">a₁</text>
<text x="616" y="98" font-size="15" fill="#475569" text-anchor="middle">a₂</text>
<text x="672" y="98" font-size="15" fill="#475569" text-anchor="middle">a₃</text>
<rect x="560" y="110" width="168" height="112" rx="4" fill="#f8fafc"/>
<path d="M616 110V222M672 110V222M560 166H728" stroke="#e2e8f0" stroke-width="1.5" fill="none"/>
<path d="M558 110h-10M548 110V222M548 222h10" stroke="#94a3b8" stroke-width="2.5" fill="none"/>
<path d="M730 110h10M740 110V222M740 222h-10" stroke="#94a3b8" stroke-width="2.5" fill="none"/>
<g font-size="19" fill="#0f172a" text-anchor="middle" dominant-baseline="central">
  <text x="588" y="138">1</text><text x="644" y="138">0</text><text x="700" y="138">1</text>
  <text x="588" y="194">0</text><text x="644" y="194">1</text><text x="700" y="194">1</text>
</g>

<text x="818" y="98" font-size="15" fill="#e63e8f" text-anchor="middle">b</text>
<rect x="790" y="110" width="56" height="168" rx="4" fill="#e63e8f" fill-opacity="0.08"/>
<path d="M790 166H846M790 222H846" stroke="#e2e8f0" stroke-width="1.5" fill="none"/>
<path d="M788 110h-10M778 110V278M778 278h10" stroke="#e63e8f" stroke-width="2.5" fill="none" stroke-opacity="0.7"/>
<path d="M848 110h10M858 110V278M858 278h-10" stroke="#e63e8f" stroke-width="2.5" fill="none" stroke-opacity="0.7"/>
<g font-size="19" fill="#e63e8f" text-anchor="middle" dominant-baseline="central" font-weight="600">
  <text x="818" y="138">2</text><text x="818" y="194">-1</text><text x="818" y="250">3</text>
</g>

<text x="650" y="330" font-size="17" fill="#0f172a" text-anchor="middle">Ab = 2a₁ − a₂ + 3a₃</text>
<text x="650" y="358" font-size="15" fill="#475569" text-anchor="middle">(2, 0) − (0, 1) + (3, 3) = (5, 2)</text>
</svg>
