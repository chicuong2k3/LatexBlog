<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330" font-family="'Segoe UI',Arial,sans-serif" font-size="16">
  <defs>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker>
    <marker id="ah-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="ah-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
  </defs>
  <!-- đường thẳng Delta -->
  <line x1="14" y1="296" x2="452" y2="98" stroke="#94a3b8" stroke-width="2"/>
  <text x="460" y="96" fill="#64748b" font-style="italic">Δ</text>
  <!-- hình chiếu proj -->
  <line x1="60" y1="270" x2="302" y2="150" stroke="#1d4ed8" stroke-width="4.5" marker-end="url(#ah-blue)"/>
  <text x="140" y="196" fill="#1d4ed8" font-style="italic">proj<tspan dy="5" font-size="12" font-weight="700">u</tspan><tspan dy="-5">(v)</tspan></text>
  <!-- vector v -->
  <line x1="60" y1="270" x2="300" y2="58" stroke="#dc2626" stroke-width="3.5" marker-end="url(#ah-red)"/>
  <text x="288" y="52" fill="#dc2626" font-style="italic" font-weight="700">v</text>
  <!-- phần vuong góc -->
  <line x1="308" y1="146" x2="308" y2="62" stroke="#a21caf" stroke-width="2.5" stroke-dasharray="6 5"/>
  <text x="318" y="110" fill="#a21caf" font-style="italic" font-weight="700">v<tspan dy="5" font-size="12">&#8869;</tspan></text>
  <!-- vectơ chỉ phương u -->
  <line x1="92" y1="253" x2="176" y2="211" stroke="#0f766e" stroke-width="4.5" marker-end="url(#ah-teal)"/>
  <text x="184" y="204" fill="#0f766e" font-style="italic" font-weight="700">u</text>
  <!-- các điểm -->
  <circle cx="60" cy="270" r="4" fill="#0f172a"/>
  <text x="48" y="290" fill="#0f172a" font-style="italic">O</text>
  <circle cx="308" cy="146" r="4" fill="#1d4ed8"/>
  <text x="318" y="162" fill="#1d4ed8" font-style="italic">H</text>
  <circle cx="308" cy="53" r="4" fill="#dc2626"/>
  <text x="318" y="50" fill="#dc2626" font-style="italic">M</text>
  <!-- ký hiệu vuông góc -->
  <polyline points="291,154 291,135 308,126" fill="none" stroke="#a21caf" stroke-width="2"/>
</svg>
