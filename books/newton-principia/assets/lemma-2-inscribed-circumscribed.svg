<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" role="img" aria-labelledby="title desc">
  <title id="title">Hình chữ thập với các hình bình hành nội tiếp và ngoại tiếp</title>
  <desc id="desc">Minh họa Lemma II: một đường cong AacE nằm giữa các đường thẳng Aa và AE, với các hình bình hành nội tiếp và ngoại tiếp.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#526078"/>
    </marker>
  </defs>
  <rect width="920" height="520" fill="#fffdf8"/>
  <g fill="none" stroke="#263248" stroke-width="3">
    <path d="M 90 420 L 90 110"/>
    <path d="M 90 420 L 820 420"/>
    <path d="M 820 420 L 820 110"/>
    <path d="M 90 110 C 300 70 610 70 820 110" stroke="#b45309" stroke-width="5"/>
    <path d="M 90 145 L 820 145" stroke="#526078" stroke-dasharray="8 8"/>
    <path d="M 90 180 L 820 180" stroke="#526078" stroke-dasharray="8 8"/>
    <path d="M 90 215 L 820 215" stroke="#526078" stroke-dasharray="8 8"/>
  </g>
  <g fill="none" stroke="#b45309" stroke-width="2" opacity="0.8">
    <path d="M 90 145 L 230 145 L 230 110"/>
    <path d="M 230 145 L 370 145 L 370 110"/>
    <path d="M 370 145 L 510 145 L 510 110"/>
    <path d="M 510 145 L 650 145 L 650 110"/>
    <path d="M 650 145 L 820 145 L 820 110"/>
  </g>
  <g fill="none" stroke="#526078" stroke-width="2" opacity="0.8">
    <path d="M 90 180 L 230 180 L 230 145"/>
    <path d="M 230 180 L 370 180 L 370 145"/>
    <path d="M 370 180 L 510 180 L 510 145"/>
    <path d="M 510 180 L 650 180 L 650 145"/>
    <path d="M 650 180 L 820 180 L 820 145"/>
  </g>
  <g fill="#263248" font-family="Georgia, serif" font-size="24">
    <text x="65" y="450">Aa</text>
    <text x="65" y="100">A</text>
    <text x="210" y="135">a</text>
    <text x="350" y="135">b</text>
    <text x="490" y="135">c</text>
    <text x="630" y="135">d</text>
    <text x="835" y="105">E</text>
    <text x="840" y="450">AE</text>
  </g>
  <g fill="#526078" font-family="Georgia, serif" font-size="21">
    <text x="150" y="490">đường cong</text>
    <text x="445" y="490">các hình bình hành nội tiếp</text>
    <text x="445" y="70">đường thẳng ngoại tiếp</text>
  </g>
</svg>
