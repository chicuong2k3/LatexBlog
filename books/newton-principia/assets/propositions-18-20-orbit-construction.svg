<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
  <title id="title">Cách dựng quỹ đạo elip, hypebol và parabol từ tiêu điểm</title>
  <desc id="desc">Sơ đồ tổng hợp dựng lại cho các Proposition XVIII–XX: tiêu điểm S, điểm P, tiếp tuyến TR, các đường tròn dựng phụ và quỹ đạo cần tìm.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 z" fill="#b45309"/>
    </marker>
  </defs>
  <rect width="1000" height="560" fill="#fffdf8"/>
  <rect x="30" y="30" width="440" height="480" rx="8" fill="#f7f1e5" stroke="#c7b99e"/>
  <rect x="530" y="30" width="440" height="480" rx="8" fill="#eef4f2" stroke="#b7c9c2"/>
  <g fill="#263248" font-family="Georgia, serif" font-size="24">
    <text x="180" y="70">Elip / Hypebol</text>
    <text x="675" y="70">Parabol</text>
  </g>
  <g stroke="#526078" stroke-width="3" fill="none">
    <ellipse cx="250" cy="270" rx="145" ry="90"/>
    <line x1="90" y1="410" x2="410" y2="410"/>
    <line x1="250" y1="410" x2="250" y2="180"/>
    <line x1="250" y1="270" x2="385" y2="155"/>
    <circle cx="385" cy="155" r="6" fill="#b45309"/>
    <path d="M 580 400 Q 770 120 960 400"/>
    <line x1="580" y1="400" x2="960" y2="400"/>
    <line x1="770" y1="400" x2="770" y2="310"/>
    <line x1="770" y1="310" x2="910" y2="160"/>
    <line x1="770" y1="310" x2="820" y2="130"/>
    <circle cx="770" cy="310" r="6" fill="#b45309"/>
    <circle cx="910" cy="160" r="6" fill="#b45309"/>
  </g>
  <g fill="#b45309" font-family="Georgia, serif" font-size="19">
    <text x="220" y="450">S</text><text x="370" y="145">P</text><text x="360" y="400">tiêu điểm</text><text x="735" y="450">S</text><text x="895" y="150">P</text><text x="735" y="300">tiêu điểm</text>
  </g>
  <g fill="#526078" font-family="Georgia, serif" font-size="17">
    <text x="65" y="485">tiếp tuyến và điểm P</text><text x="600" y="485">tiếp tuyến tại P</text>
  </g>
</svg>
