<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" role="img" aria-labelledby="t d" font-family="'Space Grotesk','Be Vietnam Pro','Segoe UI',Arial,sans-serif">
<title id="t">Ô (i, j) của AB chuyển vị và của B chuyển vị nhân A chuyển vị là cùng một tổng</title>
<desc id="d">Ô (i, j) của AB chuyển vị là ô (j, i) của AB, tức hàng j của A ghép với cột i của B. Ô (i, j) của B chuyển vị nhân A chuyển vị là hàng i của B chuyển vị, tức cột i của B, ghép với cột j của A chuyển vị, tức hàng j của A. Cùng hai dãy số, cùng các tích, chỉ đổi thứ tự hai thừa số.</desc>
