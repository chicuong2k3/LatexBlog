<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="t4 d4"
     font-family="'Space Grotesk','Be Vietnam Pro','Segoe UI',Arial,sans-serif">
<title id="t4">Đổi thứ tự hai phép biến đổi cho hai vector khác nhau</title>
<desc id="d4">Các mũi tên xuất phát từ gốc tọa độ O tới u=(1,1), Qu=(1,2), P(Qu)=(4,2), Pu=(3,1) và Q(Pu)=(3,4). Làm Q trước rồi P cho (4,2); làm P trước rồi Q cho (3,4).</desc>

<defs>
  <marker id="mAxis" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
  </marker>
  <marker id="mInk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="#0f172a"/>
  </marker>
  <marker id="mBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
  </marker>
  <marker id="mAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
  </marker>
  <marker id="mBlueS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="#2563eb" fill-opacity="0.55"/>
  </marker>
  <marker id="mAmberS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="#d97706" fill-opacity="0.55"/>
  </marker>
</defs>

<!-- Gốc O = (130,350); mỗi đơn vị = 56px -->

<!-- ============ lưới và trục ============ -->
<g stroke="#e2e8f0" stroke-width="1">
  <line x1="186" y1="70" x2="186" y2="350"/>
  <line x1="242" y1="70" x2="242" y2="350"/>
  <line x1="298" y1="70" x2="298" y2="350"/>
  <line x1="354" y1="70" x2="354" y2="350"/>
  <line x1="410" y1="70" x2="410" y2="350"/>
  <line x1="130" y1="294" x2="410" y2="294"/>
  <line x1="130" y1="238" x2="410" y2="238"/>
  <line x1="130" y1="182" x2="410" y2="182"/>
  <line x1="130" y1="126" x2="410" y2="126"/>
  <line x1="130" y1="70" x2="410" y2="70"/>
</g>
<line x1="100" y1="350" x2="434" y2="350" stroke="#64748b" stroke-width="1.5" marker-end="url(#mAxis)"/>
<line x1="130" y1="380" x2="130" y2="52" stroke="#64748b" stroke-width="1.5" marker-end="url(#mAxis)"/>
<text x="440" y="355" font-size="15" fill="#64748b" font-style="italic">x</text>
<text x="118" y="58" font-size="15" fill="#64748b" font-style="italic" text-anchor="end">y</text>
<text x="118" y="366" font-size="14" fill="#64748b" text-anchor="end">O</text>
<g font-size="12" fill="#94a3b8" text-anchor="middle">
  <text x="186" y="368">1</text><text x="242" y="368">2</text><text x="298" y="368">3</text>
  <text x="354" y="368">4</text><text x="410" y="368">5</text>
</g>
<g font-size="12" fill="#94a3b8" text-anchor="end">
  <text x="122" y="298">1</text><text x="122" y="242">2</text><text x="122" y="186">3</text>
  <text x="122" y="130">4</text><text x="122" y="74">5</text>
</g>

<!-- ============ nối các bước (nét đứt mảnh) ============ -->
<path d="M186 294V246" stroke="#2563eb" stroke-opacity="0.55" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#mBlueS)"/>
<path d="M186 238H344" stroke="#2563eb" stroke-opacity="0.55" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#mBlueS)"/>
<path d="M186 294H288" stroke="#d97706" stroke-opacity="0.55" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#mAmberS)"/>
<path d="M298 294V136" stroke="#d97706" stroke-opacity="0.55" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#mAmberS)"/>

<!-- ============ các vector từ gốc O ============ -->
<line x1="130" y1="350" x2="186" y2="294" stroke="#0f172a" stroke-width="2.5" marker-end="url(#mInk)"/>
<line x1="130" y1="350" x2="186" y2="238" stroke="#2563eb" stroke-width="2.5" marker-end="url(#mBlue)"/>
<line x1="130" y1="350" x2="354" y2="238" stroke="#2563eb" stroke-width="3" marker-end="url(#mBlue)"/>
<line x1="130" y1="350" x2="298" y2="294" stroke="#d97706" stroke-width="2.5" marker-end="url(#mAmber)"/>
<line x1="130" y1="350" x2="298" y2="126" stroke="#d97706" stroke-width="3" marker-end="url(#mAmber)"/>

<!-- ============ nhãn ============ -->
<text x="194" y="287" font-size="15" fill="#0f172a" font-weight="600">u</text>
<text x="176" y="226" font-size="15" fill="#2563eb" text-anchor="end">Qu</text>
<text x="364" y="232" font-size="15" fill="#2563eb" font-weight="600">P(Qu)</text>
<text x="306" y="314" font-size="15" fill="#d97706">Pu</text>
<text x="308" y="122" font-size="15" fill="#d97706" font-weight="600">Q(Pu)</text>

<!-- ============ hai ma trận ============ -->
<g transform="translate(-40,0)">
  <text x="546" y="140" font-size="17" font-weight="600" fill="#475569" text-anchor="end">P</text>
  <rect x="560" y="90" width="100" height="100" rx="4" fill="#f8fafc"/>
  <path d="M610 90V190M560 140H660" stroke="#e2e8f0" stroke-width="1.5" fill="none"/>
  <path d="M558 90h-10M548 90V190M548 190h10" stroke="#94a3b8" stroke-width="2.5" fill="none"/>
  <path d="M662 90h10M672 90V190M672 190h-10" stroke="#94a3b8" stroke-width="2.5" fill="none"/>
  <g font-size="19" fill="#0f172a" text-anchor="middle" dominant-baseline="central">
    <text x="585" y="115">2</text><text x="635" y="115">1</text>
    <text x="585" y="165">0</text><text x="635" y="165">1</text>
  </g>

  <text x="546" y="270" font-size="17" font-weight="600" fill="#475569" text-anchor="end">Q</text>
  <rect x="560" y="220" width="100" height="100" rx="4" fill="#f8fafc"/>
  <path d="M610 220V320M560 270H660" stroke="#e2e8f0" stroke-width="1.5" fill="none"/>
  <path d="M558 220h-10M548 220V320M548 320h10" stroke="#94a3b8" stroke-width="2.5" fill="none"/>
  <path d="M662 220h10M672 220V320M672 320h-10" stroke="#94a3b8" stroke-width="2.5" fill="none"/>
  <g font-size="19" fill="#0f172a" text-anchor="middle" dominant-baseline="central">
    <text x="585" y="245">1</text><text x="635" y="245">0</text>
    <text x="585" y="295">1</text><text x="635" y="295">1</text>
  </g>
</g>

<!-- ============ bảng chú giải ============ -->
<rect x="670" y="90" width="260" height="248" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="688" y="122" font-size="15" fill="#2563eb" font-weight="600">Q trước, P sau</text>
<text x="688" y="146" font-size="14" fill="#475569">u → Qu → P(Qu)</text>
<text x="688" y="170" font-size="14" fill="#475569">(1,1) → (1,2) → (4,2)</text>
<text x="688" y="194" font-size="14" fill="#475569">tức (PQ)u</text>
<line x1="688" y1="214" x2="912" y2="214" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="688" y="246" font-size="15" fill="#d97706" font-weight="600">P trước, Q sau</text>
<text x="688" y="270" font-size="14" fill="#475569">u → Pu → Q(Pu)</text>
<text x="688" y="294" font-size="14" fill="#475569">(1,1) → (3,1) → (3,4)</text>
<text x="688" y="318" font-size="14" fill="#475569">tức (QP)u</text>
</svg>
