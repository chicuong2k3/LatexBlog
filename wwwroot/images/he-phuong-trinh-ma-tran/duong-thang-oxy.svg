<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" font-family="'Segoe UI',Arial,sans-serif" font-size="15">
  <defs>
    <marker id="ah-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <!-- lưới mờ mỗi đơn vị -->
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="160" y1="30" x2="160" y2="280"/>
    <line x1="230" y1="30" x2="230" y2="280"/>
    <line x1="300" y1="30" x2="300" y2="280"/>
    <line x1="370" y1="30" x2="370" y2="280"/>
    <line x1="440" y1="30" x2="440" y2="280"/>
    <line x1="510" y1="30" x2="510" y2="280"/>
    <line x1="90" y1="210" x2="530" y2="210"/>
    <line x1="90" y1="140" x2="530" y2="140"/>
    <line x1="90" y1="70" x2="530" y2="70"/>
  </g>
  <!-- trục Ox, Oy -->
  <line x1="70" y1="280" x2="530" y2="280" stroke="#64748b" stroke-width="2" marker-end="url(#ah-slate)"/>
  <line x1="90" y1="300" x2="90" y2="30" stroke="#64748b" stroke-width="2" marker-end="url(#ah-slate)"/>
  <text x="534" y="284" fill="#64748b" font-style="italic">x</text>
  <text x="70" y="44" fill="#64748b" font-style="italic">y</text>
  <text x="72" y="296" fill="#64748b" font-style="italic">O</text>
  <!-- đường thẳng 2x + 3y = 6 -->
  <line x1="55" y1="117" x2="335" y2="303" stroke="#e63e8f" stroke-width="3" stroke-linecap="round"/>
  <text x="344" y="150" fill="#be185d" font-weight="bold">2x + 3y = 6</text>
  <!-- ba điểm kiểm tra -->
  <circle cx="90" cy="140" r="5.5" fill="#e63e8f" stroke="#ffffff" stroke-width="2"/>
  <text x="100" y="132" fill="#0f172a">(0, 2)</text>
  <circle cx="300" cy="280" r="5.5" fill="#e63e8f" stroke="#ffffff" stroke-width="2"/>
  <text x="300" y="302" text-anchor="middle" fill="#0f172a">(3, 0)</text>
  <circle cx="160" cy="187" r="5.5" fill="#e63e8f" stroke="#ffffff" stroke-width="2"/>
  <text x="170" y="182" fill="#0f172a">(1, 4/3)</text>
  <!-- hai cặp số không phải nghiệm -->
  <circle cx="160" cy="210" r="5" fill="#64748b" stroke="#ffffff" stroke-width="2"/>
  <text x="160" y="250" text-anchor="middle" fill="#64748b">(1, 1): L = 5</text>
  <circle cx="230" cy="280" r="5" fill="#64748b" stroke="#ffffff" stroke-width="2"/>
  <text x="215" y="320" text-anchor="middle" fill="#64748b">(2, 0): L = 4</text>
</svg>
