<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">Quỹ tích conic qua các đường thẳng kẻ từ một điểm</title>
  <desc id="desc">Sơ đồ tổng hợp cho Lemma XVII–XXI: điểm P kẻ các đường tới bốn cạnh của một hình thang, quỹ tích là một hình cắt conic.</desc>
  <rect width="960" height="560" fill="#fffdf8"/>
  <ellipse cx="480" cy="285" rx="310" ry="145" fill="none" stroke="#263248" stroke-width="5"/>
  <path d="M 180 205 L 300 110 L 730 185 L 780 390 L 300 440 Z" fill="none" stroke="#526078" stroke-width="4"/>
  <circle cx="480" cy="285" r="8" fill="#b45309"/>
  <g stroke="#526078" stroke-width="3" fill="none">
    <line x1="480" y1="285" x2="300" y2="110"/>
    <line x1="480" y1="285" x2="730" y2="185"/>
    <line x1="480" y1="285" x2="780" y2="390"/>
    <line x1="480" y1="285" x2="300" y2="440"/>
  </g>
  <g fill="#b45309" font-family="Georgia, serif" font-size="22">
    <text x="465" y="270">P</text><text x="275" y="95">A</text><text x="290" y="465">B</text><text x="740" y="170">C</text><text x="790" y="420">D</text>
  </g>
  <g fill="#526078" font-family="Georgia, serif" font-size="18">
    <text x="80" y="515">bốn đường kẻ từ P tới các cạnh của hình thang</text>
    <text x="360" y="85">quỹ tích là hình cắt conic</text>
  </g>
</svg>
