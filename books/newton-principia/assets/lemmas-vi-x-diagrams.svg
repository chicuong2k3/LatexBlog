<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Các sơ đồ minh họa Lemma VI đến Lemma X</title>
  <desc id="desc">Bảng tổng hợp các sơ đồ tiếp tuyến, cung, tam giác, diện tích và đồ thị vận tốc dùng trong Lemma VI đến Lemma X.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b45309"/>
    </marker>
  </defs>
  <rect width="1200" height="760" fill="#fffdf8"/>
  <g stroke="#d6dbe5" stroke-width="2">
    <path d="M 400 40 V 720"/><path d="M 800 40 V 720"/>
    <path d="M 40 380 H 1160"/>
  </g>
  <g fill="#263248" font-family="Georgia, serif" font-size="24">
    <text x="40" y="35">VI–VII. Cung và tiếp tuyến</text>
    <text x="440" y="35">VIII. Các tam giác</text>
    <text x="840" y="35">IX–X. Diện tích và vận tốc</text>
  </g>
  <g transform="translate(40 100)">
    <path d="M 30 220 C 110 70 250 70 320 220" fill="none" stroke="#b45309" stroke-width="5"/>
    <path d="M 30 220 L 300 40" stroke="#526078" stroke-width="3"/>
    <path d="M 30 220 L 320 220" stroke="#263248" stroke-width="3"/>
    <path d="M 30 220 L 205 220" stroke="#b45309" stroke-width="3" marker-end="url(#arrow)"/>
    <g fill="#263248" font-family="Georgia, serif" font-size="20"><text x="20" y="250">A</text><text x="305" y="245">B</text><text x="295" y="30">D</text><text x="170" y="115">C</text></g>
  </g>
  <g transform="translate(440 100)">
    <path d="M 30 220 L 300 40" stroke="#526078" stroke-width="3"/>
    <path d="M 30 220 L 300 220" stroke="#263248" stroke-width="3"/>
    <path d="M 30 220 L 180 220 L 180 100 Z" fill="none" stroke="#b45309" stroke-width="4"/>
    <path d="M 180 100 L 300 40" stroke="#b45309" stroke-width="4" marker-end="url(#arrow)"/>
    <g fill="#263248" font-family="Georgia, serif" font-size="20"><text x="15" y="250">R</text><text x="165" y="90">A</text><text x="280" y="245">B</text><text x="290" y="30">D</text></g>
  </g>
  <g transform="translate(840 100)">
    <path d="M 30 240 L 30 60" stroke="#263248" stroke-width="3"/>
    <path d="M 30 240 L 300 240" stroke="#263248" stroke-width="3"/>
    <path d="M 30 240 C 100 220 140 150 210 105 C 260 75 290 60 300 55" fill="none" stroke="#b45309" stroke-width="5"/>
    <path d="M 30 240 L 210 105" stroke="#526078" stroke-width="3" stroke-dasharray="7 7"/>
    <g fill="#263248" font-family="Georgia, serif" font-size="20"><text x="10" y="270">A</text><text x="280" y="275">E</text><text x="200" y="95">B</text><text x="295" y="45">C</text></g>
  </g>
  <g fill="#526078" font-family="Georgia, serif" font-size="20">
    <text x="65" y="335">góc giữa cung và tiếp tuyến</text>
    <text x="455" y="335">tam giác đồng dạng khi cung thu nhỏ</text>
    <text x="865" y="335">diện tích và quỹ đạo</text>
  </g>
  <g transform="translate(80 470)">
    <path d="M 0 170 L 260 170" stroke="#263248" stroke-width="3"/>
    <path d="M 0 170 C 80 170 120 55 260 20" fill="none" stroke="#b45309" stroke-width="5"/>
    <path d="M 0 170 L 260 20" stroke="#526078" stroke-width="2" stroke-dasharray="7 7"/>
    <path d="M 80 170 L 80 128" stroke="#526078" stroke-width="2"/>
    <path d="M 160 170 L 160 83" stroke="#526078" stroke-width="2"/>
    <g fill="#263248" font-family="Georgia, serif" font-size="18"><text x="-5" y="200">A</text><text x="250" y="200">t</text><text x="55" y="155">v₁</text><text x="135" y="110">v₂</text></g>
  </g>
  <g transform="translate(500 470)">
    <path d="M 0 170 L 260 170" stroke="#263248" stroke-width="3"/>
    <path d="M 0 170 L 260 30" stroke="#526078" stroke-width="3"/>
    <path d="M 0 170 L 260 170 L 260 30 Z" fill="#f2e6d5" stroke="#b45309" stroke-width="3"/>
    <g fill="#263248" font-family="Georgia, serif" font-size="18"><text x="-5" y="200">A</text><text x="120" y="160">D</text><text x="250" y="200">B</text></g>
  </g>
  <g transform="translate(900 470)">
    <path d="M 0 170 C 80 40 190 20 260 0" fill="none" stroke="#b45309" stroke-width="5"/>
    <path d="M 0 170 L 260 170" stroke="#263248" stroke-width="3"/>
    <path d="M 0 170 L 260 0" stroke="#526078" stroke-width="2" stroke-dasharray="7 7"/>
    <g fill="#263248" font-family="Georgia, serif" font-size="18"><text x="-5" y="200">A</text><text x="245" y="200">E</text><text x="120" y="90">C</text></g>
  </g>
  <g fill="#526078" font-family="Georgia, serif" font-size="19">
    <text x="70" y="710">đường cong đồng dạng</text>
    <text x="490" y="710">diện tích tam giác</text>
    <text x="900" y="710">cung và dây cung</text>
