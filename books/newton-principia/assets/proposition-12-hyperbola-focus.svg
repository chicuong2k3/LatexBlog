<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc">
  <title id="title">Hypebol, hai tiêu điểm và lực hướng tâm</title>
  <desc id="desc">Sơ đồ Proposition XII: nhánh hypebol, tâm C, hai tiêu điểm S và H, đường kính liên hợp, tiếp tuyến và các đoạn dùng trong chứng minh.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b45309"/>
    </marker>
  </defs>
  <rect width="1000" height="540" fill="#fffdf8"/>
  <path d="M 500 420 C 220 350 140 210 220 95 C 270 25 390 25 500 105" fill="none" stroke="#263248" stroke-width="5"/>
  <path d="M 500 105 C 610 25 730 25 780 95 C 860 210 780 350 500 420" fill="none" stroke="#263248" stroke-width="5"/>
  <circle cx="500" cy="270" r="7" fill="#b45309"/>
  <circle cx="340" cy="270" r="7" fill="#526078"/>
  <circle cx="660" cy="270" r="7" fill="#526078"/>
  <path d="M 500 270 L 650 145" stroke="#b45309" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M 500 270 L 350 145" stroke="#526078" stroke-width="3" stroke-dasharray="7 7"/>
  <path d="M 650 145 L 680 70" stroke="#526078" stroke-width="3"/>
  <path d="M 650 270 L 650 400" stroke="#526078" stroke-width="3"/>
  <g fill="#263248" font-family="Georgia, serif" font-size="22">
    <text x="475" y="305">C</text><text x="320" y="305">H</text><text x="650" y="305">S</text>
    <text x="640" y="135">P</text><text x="670" y="60">T</text><text x="635" y="425">Q</text>
  </g>
  <g fill="#526078" font-family="Georgia, serif" font-size="19">
    <text x="100" y="490">nhánh hypebol</text>
    <text x="420" y="490">tâm và tiêu điểm</text>
    <text x="720" y="490">tiếp tuyến</text>
  </g>
</svg>
