<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-labelledby="title desc">
  <title id="title">Hình bình hành ABCD minh họa hợp lực của hai lực</title>
  <desc id="desc">Hai lực M và N cùng tác dụng tại A, lần lượt theo AB và AC. Hợp lực đi theo đường chéo AD của hình bình hành ABCD.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/>
    </marker>
  </defs>
  <rect width="760" height="430" fill="#fffdf8"/>
  <g fill="none" stroke="#263248" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 120 320 L 470 320 L 610 120 L 260 120 Z"/>
    <path d="M 120 320 L 260 120" stroke-dasharray="8 8"/>
  </g>
  <g fill="none" stroke="#b45309" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)">
    <path d="M 120 320 L 450 320"/>
    <path d="M 120 320 L 590 120"/>
    <path d="M 120 320 L 255 120"/>
  </g>
  <g fill="#263248" font-family="Georgia, serif" font-size="28">
    <text x="95" y="355">A</text>
    <text x="475" y="355">B</text>
    <text x="620" y="125">C</text>
    <text x="240" y="105">D</text>
    <text x="265" y="305">M</text>
    <text x="500" y="205">N</text>
    <text x="160" y="245" fill="#b45309">AD</text>
  </g>
  <g fill="#526078" font-family="Georgia, serif" font-size="22">
    <text x="300" y="385">lực M</text>
    <text x="470" y="145">lực N</text>
    <text x="305" y="110">hợp lực</text>
  </g>
</svg>
